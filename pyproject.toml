[project]
name = "reporting-agent"
version = "0.1.0"
description = "A Google Drive & Docs Reporting Agent using ADK and MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[a2a]>=1.0.0",
    "fastmcp>=0.4.1",
    "google-api-python-client>=2.128.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.1",
    "markdown>=3.10.2",
    "fastapi>=0.136.3",
    "python-multipart>=0.0.31",
    "python-pptx>=1.0.2",
    "pypdf>=6.13.1",
    "pillow>=12.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.1",
]
